<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyOps · CrossBorder Ops Agent</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F0EC;--surface:#FFFFFF;--surface2:#F8F7F5;--surface3:#F0EEE9;
  --border:#E4E1DB;--border2:#CCC9C2;
  --text:#1C1B18;--text2:#6B6860;--text3:#AEAAA4;
  --red:#DC2626;--red-lt:#FEF2F2;--red-bd:#FECACA;
  --blue:#2563EB;--blue-lt:#EFF6FF;--blue-bd:#BFDBFE;
  --green:#16A34A;--green-lt:#F0FDF4;--green-bd:#BBF7D0;
  --purple:#7C3AED;--purple-lt:#F5F3FF;--purple-bd:#DDD6FE;
  --amber:#D97706;--amber-lt:#FFFBEB;--amber-bd:#FDE68A;
  --sh:0 1px 3px rgba(0,0,0,.07);
  --sh-md:0 4px 16px rgba(0,0,0,.1);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.6}

/* ── Shell ── */
.app{height:100vh;display:flex;flex-direction:column}

/* ── Topbar ── */
.topbar{height:46px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:var(--sh)}
.logo{font-size:14px;font-weight:700;letter-spacing:-.3px}.logo em{color:var(--red);font-style:normal}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.tp-red{background:var(--red-lt);color:var(--red);border:1px solid var(--red-bd)}
.tp-blue{background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-bd)}
.tp-green{background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)}
.tp-purple{background:var(--purple-lt);color:var(--purple);border:1px solid var(--purple-bd)}

/* ── Body split ── */
.body{flex:1;display:flex;overflow:hidden;min-height:0}

/* ── LEFT: chat panel ── */
.chat-panel{width:480px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}

.chat-history{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}

/* bubbles */
.bubble{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.av-agent{background:var(--red-lt);border:1px solid var(--red-bd);color:var(--red)}
.av-system{background:var(--blue-lt);border:1px solid var(--blue-bd);color:var(--blue)}
.bubble-body{flex:1;max-width:360px}
.bubble-name{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:3px;letter-spacing:.3px;text-transform:uppercase}
.bubble-text{font-size:13px;color:var(--text2);line-height:1.65;background:var(--surface2);border:1px solid var(--border);border-radius:3px 10px 10px 10px;padding:9px 13px}
.bubble-text strong{color:var(--text)}
.bubble-text.agent-thinking{background:var(--purple-lt);border-color:var(--purple-bd);color:var(--purple)}
.bubble-text.agent-thinking strong{color:var(--purple)}
.bubble-text.system-msg{background:var(--blue-lt);border-color:var(--blue-bd);color:var(--blue)}

/* user bubble (right) */
.bubble.user{flex-direction:row-reverse}
.bubble.user .bubble-body{max-width:280px}
.bubble.user .bubble-text{background:var(--red);color:white;border-color:var(--red);border-radius:10px 3px 10px 10px}
.bubble.user .bubble-name{text-align:right}

/* tool call log */
.tool-call{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);padding:4px 0;animation:fadeUp .3s ease}
.tc-icon{font-size:10px}
.tc-tag{font-family:monospace;font-size:10px;background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-bd);padding:1px 6px;border-radius:3px}
.tc-status{font-size:10px}
.tc-status.ok{color:var(--green)}
.tc-status.spin{color:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* choice chips */
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;animation:fadeUp .3s ease}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);transition:all .15s}
.chip:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.chip.selected{border-color:var(--red);background:var(--red);color:white}
.chip:disabled,.chip.disabled{opacity:.4;pointer-events:none}

/* hitl buttons */
.hitl-btns{display:flex;flex-direction:column;gap:6px;margin-top:4px;animation:fadeUp .3s ease}
.hitl-btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .15s;text-align:left;display:flex;align-items:center;gap:8px}
.hb-go{background:var(--green-lt);color:var(--green);border-color:var(--green-bd)}
.hb-go:hover{background:var(--green);color:white}
.hb-noted{background:var(--amber-lt);color:var(--amber);border-color:var(--amber-bd)}
.hb-noted:hover{background:var(--amber);color:white}
.hb-stop{background:var(--red-lt);color:var(--red);border-color:var(--red-bd)}
.hb-stop:hover{background:var(--red);color:white}

/* input area */
.chat-input-area{flex-shrink:0;padding:14px 16px;border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:10px}

/* country selector */
.country-row{display:flex;gap:6px;flex-wrap:wrap}
.country-btn{padding:6px 13px;border-radius:7px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:5px}
.country-btn:hover{border-color:var(--red);color:var(--red)}
.country-btn.active{border-color:var(--red);background:var(--red-lt);color:var(--red);font-weight:600}

.input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);background:var(--surface2);outline:none;resize:none;font-family:inherit;line-height:1.55;transition:border-color .2s;max-height:140px;min-height:72px}
.chat-input:focus{border-color:var(--red)}
.chat-input:disabled{opacity:.5;cursor:not-allowed}
.send-btn{width:42px;height:42px;border-radius:9px;background:var(--red);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .2s;flex-shrink:0}
.send-btn:hover:not(:disabled){background:#B91C1C}
.send-btn:disabled{background:var(--text3);cursor:not-allowed}

/* ── RIGHT: report panel ── */
.report-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}

.report-header{height:46px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.rh-title{font-size:13px;font-weight:600;flex:1}
.rh-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.rhb-waiting{background:var(--surface3);color:var(--text3);border:1px solid var(--border)}
.rhb-running{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-bd)}
.rhb-done{background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)}

.report-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:0}

/* empty state */
.report-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)}
.re-icon{font-size:40px;opacity:.35}
.re-title{font-size:14px;font-weight:600;color:var(--text2)}
.re-sub{font-size:12px;text-align:center;max-width:240px;line-height:1.65}

/* report sections */
.r-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;animation:fadeUp .4s ease}
.rs-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.rs-head h3{font-size:12px;font-weight:600;flex:1}
.rs-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.rst-blue{background:var(--blue-lt);color:var(--blue)}
.rst-green{background:var(--green-lt);color:var(--green)}
.rst-purple{background:var(--purple-lt);color:var(--purple)}
.rst-amber{background:var(--amber-lt);color:var(--amber)}
.rs-body{padding:14px 16px}

/* score card */
.score-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.score-num{font-size:36px;font-weight:700;color:var(--green);letter-spacing:-1px;line-height:1}
.score-label{font-size:11px;color:var(--text2)}
.score-verdict{font-size:13px;font-weight:600;color:var(--green)}
.score-badge{display:inline-flex;align-items:center;gap:4px;background:var(--green-lt);border:1px solid var(--green-bd);color:var(--green);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;margin-top:4px}

/* data grid */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.data-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
.dc-label{font-size:10px;color:var(--text3);margin-bottom:3px;font-weight:500}
.dc-value{font-size:16px;font-weight:700;letter-spacing:-.3px}
.dc-sub{font-size:10px;color:var(--text2);margin-top:2px}
.dc-value.green{color:var(--green)}
.dc-value.amber{color:var(--amber)}
.dc-value.blue{color:var(--blue)}

/* ── Scout 三列布局 ── */
.scout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;min-width:0;align-items:start}
.scout-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible;display:flex;flex-direction:column}
.sc-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);background:var(--surface2);border-radius:10px 10px 0 0}
.sc-agent-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:4px}
.sc-agent-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.sc-agent-src{font-size:10px;color:var(--text3);margin-top:3px}
.sc-body{padding:14px 16px;display:flex;flex-direction:column;gap:9px}

/* metric rows */
.metric-row{padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px}
.mr-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px}
.mr-value{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.mr-sub{font-size:11px;color:var(--text2);margin-top:3px}
.mr-value.green{color:var(--green)}
.mr-value.amber{color:var(--amber)}
.mr-value.blue{color:var(--blue)}
.mr-value.red{color:var(--red)}

/* market share stacked bar */
.share-bar-track{height:7px;background:var(--surface3);border-radius:4px;overflow:hidden;display:flex;margin-top:5px}
.share-seg{height:100%}
.share-legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sl-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.sl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* SVG trend line */
.trend-svg-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
.tc-label{font-size:10px;color:var(--text3);margin-bottom:6px;font-weight:500}
.trend-svg{width:100%;height:72px;display:block;overflow:visible}
.trend-months{display:flex;justify-content:space-between;margin-top:3px;font-size:9px;color:var(--text3)}

/* pain/pos list */
.pain-list{display:flex;flex-direction:column;gap:5px}
.pain-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;font-size:11px}
.pi-pain{background:var(--red-lt);border:1px solid var(--red-bd)}
.pi-pos{background:var(--green-lt);border:1px solid var(--green-bd)}
.pi-neutral{background:var(--surface3);border:1px solid var(--border)}
.pi-icon{font-size:13px;flex-shrink:0}
.pi-text{flex:1;color:var(--text2);line-height:1.4}
.pi-text strong{color:var(--text)}

/* Scout 主控（全宽）*/
.scout-master{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible;animation:fadeUp .4s ease;margin-bottom:0}
.sm-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:10px}
.sm-agent-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:3px}
.sm-head-title{font-size:16px;font-weight:700;flex:1}
.sm-body{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.sm-row{display:grid;grid-template-columns:170px 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
.sm-dim{font-size:13px;font-weight:700;color:var(--text);line-height:1.4}
.sm-signal{font-size:12px;color:var(--text2);line-height:1.6}
.verdict-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px;white-space:nowrap;border:1.5px solid}
.vc-green{background:var(--green-lt);color:var(--green);border-color:var(--green-bd)}
.vc-amber{background:var(--amber-lt);color:var(--amber);border-color:var(--amber-bd)}
.vc-blue{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-bd)}

/* insight box */
.insight-box{background:var(--blue-lt);border:1px solid var(--blue-bd);border-radius:7px;padding:10px 12px;font-size:11px;color:var(--blue);line-height:1.65}

/* ── Guard 合规报告新样式 ── */

/* 顶部决策摘要 */
.guard-verdict{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;animation:fadeUp .4s ease}
.gv-light{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.gv-light.amber{background:var(--amber);box-shadow:0 0 0 4px var(--amber-bd)}
.gv-light.green{background:var(--green);box-shadow:0 0 0 4px var(--green-bd)}
.gv-light.red{background:var(--red);box-shadow:0 0 0 4px var(--red-bd)}
.gv-status{font-size:20px;font-weight:800;letter-spacing:-.3px;flex:1}
.gv-counters{display:flex;gap:12px}
.gv-cnt{text-align:center;padding:8px 14px;border-radius:8px;border:1px solid var(--border)}
.gvc-num{font-size:22px;font-weight:800;line-height:1}
.gvc-label{font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap}
.gv-eta{padding:10px 14px;background:var(--amber-lt);border:1px solid var(--amber-bd);border-radius:8px;text-align:center}
.gv-eta-num{font-size:18px;font-weight:800;color:var(--amber)}
.gv-eta-label{font-size:10px;color:var(--amber);margin-top:2px}

/* 法规分层地图 */
.reg-map{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible;animation:fadeUp .4s ease}
.reg-layer{display:flex;gap:0}
.reg-layer-label{width:90px;flex-shrink:0;padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;border-right:1px solid var(--border)}
.rll-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 6px;border-radius:4px;display:inline-block;width:fit-content}
.rll-name{font-size:11px;font-weight:600;color:var(--text2);margin-top:2px}
.rll-eu{background:var(--blue-lt);color:var(--blue)}
.rll-it{background:var(--green-lt);color:var(--green)}
.rll-de{background:var(--green-lt);color:var(--green)}
.rll-fr{background:var(--purple-lt);color:var(--purple)}
.rll-nl{background:var(--blue-lt);color:var(--blue)}
.rll-es{background:var(--amber-lt);color:var(--amber)}
.reg-layer-rules{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.reg-layer + .reg-layer{border-top:2px dashed var(--border)}
.rule-card{padding:11px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);display:flex;gap:12px;align-items:flex-start}
.rule-sev{width:6px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:16px}
.rs-must{background:var(--red)}
.rs-high{background:var(--amber)}
.rs-low{background:var(--blue-bd)}
.rule-body{flex:1}
.rule-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rule-desc{font-size:11px;color:var(--text2);line-height:1.6}
.rule-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.rb-fatal{background:var(--red-lt);color:var(--red);border:1px solid var(--red-bd)}
.rb-must{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-bd)}
.rb-suggest{background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-bd)}

/* 认证时间轴 */
.cert-timeline{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible;animation:fadeUp .4s ease}
.ct-head{padding:14px 18px 10px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:8px}
.ct-head-title{font-size:14px;font-weight:700;flex:1}
.ct-body{padding:16px 18px}
.ct-track{display:flex;flex-direction:column;gap:10px}
.ct-item{display:flex;gap:12px;align-items:flex-start}
.ct-week{width:42px;font-size:10px;font-weight:700;color:var(--text3);padding-top:2px;text-align:right;flex-shrink:0}
.ct-line{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0}
.ct-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ct-dot.red{background:var(--red)}
.ct-dot.amber{background:var(--amber)}
.ct-dot.green{background:var(--green)}
.ct-dot.blue{background:var(--blue)}
.ct-connector{width:2px;flex:1;background:var(--border);min-height:16px;margin:2px 0}
.ct-content{flex:1;padding-bottom:6px}
.ct-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.ct-detail{font-size:11px;color:var(--text2);line-height:1.55}
.ct-parallel{font-size:10px;color:var(--blue);font-weight:600;margin-top:2px}

/* 执行清单 */
.exec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:fadeUp .4s ease}
.exec-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:visible}
.ec-head{padding:12px 14px 8px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:700}
.ec-body{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.ec-item{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text2);line-height:1.5}
.ec-bullet{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px}
.ecb-red{background:var(--red-lt);color:var(--red);border:1px solid var(--red-bd)}
.ecb-amber{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-bd)}
.ecb-blue{background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-bd)}

/* listing */
.listing-title{font-size:12px;font-weight:700;line-height:1.55;font-family:Georgia,serif;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;margin-bottom:8px}
.bullet-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.bullet-item{font-size:11px;color:var(--text2);line-height:1.6;padding:6px 10px;border-left:2px solid var(--purple-bd);background:var(--purple-lt);border-radius:0 5px 5px 0}
.bullet-item strong{color:var(--text)}
.culture-notes{display:flex;flex-direction:column;gap:4px}
.cn-item{font-size:11px;color:var(--text2);padding:5px 9px;background:var(--amber-lt);border:1px solid var(--amber-bd);border-radius:5px;line-height:1.55}
.compliance-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ct-tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:100px;background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)}

/* confirm btn (scout → guard transition) */
.confirm-btn-wrap{margin-top:4px;animation:fadeUp .3s ease}
.confirm-btn{width:100%;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--blue-bd);background:var(--blue-lt);color:var(--blue);transition:all .15s;text-align:left;display:flex;align-items:center;gap:8px}
.confirm-btn:hover{background:var(--blue);color:white;border-color:var(--blue)}
.confirm-btn:disabled{opacity:.45;pointer-events:none}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
</style>
</head>
<body>
<div class="app">

<!-- Topbar -->
<div class="topbar">
  <div class="logo">Joy<em>Ops</em> <span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:6px">CrossBorder Ops Agent</span></div>
  <div class="tb-right">
    <span class="tb-pill tp-red">Demo</span>
    <span class="tb-pill tp-blue">Scout</span>
    <span class="tb-pill tp-green">Guard</span>
    <span class="tb-pill tp-purple">Marketing</span>
  </div>
</div>

<!-- Body -->
<div class="body">

  <!-- LEFT: Chat -->
  <div class="chat-panel">
    <div class="chat-history" id="chatHistory">
      <!-- initial message -->
      <div class="bubble">
        <div class="bubble-avatar av-agent">J</div>
        <div class="bubble-body">
          <div class="bubble-name">JoyOps Agent</div>
          <div class="bubble-text">你好！我是 CrossBorder Ops Agent。<br><br>请先选择<strong>目标国家</strong>，然后告诉我你想分析的品类或者你观察到的电商市场信息——可以是具体品类（如"空气炸锅"），也可以是模糊描述（如"小家电"）。</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <!-- Country selector -->
      <div class="country-row" id="countryRow">
        <button class="country-btn" data-country="de" onclick="selectCountry(this)">🇩🇪 德国</button>
        <button class="country-btn" data-country="fr" onclick="selectCountry(this)">🇫🇷 法国</button>
        <button class="country-btn" data-country="it" onclick="selectCountry(this)">🇮🇹 意大利</button>
        <button class="country-btn" data-country="nl" onclick="selectCountry(this)">🇳🇱 荷兰</button>
        <button class="country-btn" data-country="es" onclick="selectCountry(this)">🇪🇸 西班牙</button>
      </div>
      <!-- Text input -->
      <div class="input-row">
        <textarea class="chat-input" id="chatInput" placeholder="输入品类或描述，例如：空气炸锅 / 小家电 / 我想进入厨房用品市场…" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleSend()" title="发送">→</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Report -->
  <div class="report-panel">
    <div class="report-header">
      <div class="rh-title" id="reportTitle">分析报告</div>
      <div class="rh-badge rhb-waiting" id="reportBadge">等待输入</div>
    </div>
    <div class="report-body" id="reportBody">
      <div class="report-empty">
        <div class="re-icon">📊</div>
        <div class="re-title">报告将在这里展示</div>
        <div class="re-sub">在左侧输入品类和目标国家，Agent 分析完成后，完整报告会显示在这里</div>
      </div>
    </div>
  </div>

</div><!-- /body -->
</div><!-- /app -->

<script>
(function(){

/* ══ State ══ */
var state = {
  country: null,
  countryName: null,
  stage: 'input',      // input | clarify | scout_running | scout_done | guard_running | guard_done | hitl | marketing_running | done
  selectedSubcat: null,
  inputLocked: false,
  timers: []
};

var SUBCATS = {
  '小家电': [
    {id:'airfryer', label:'🍳 空气炸锅', hint:'月搜索量 24.6万，趋势上升'},
    {id:'coffee',   label:'☕ 咖啡机',   hint:'月搜索量 18.2万，成熟市场'},
    {id:'blender',  label:'🥤 破壁料理机', hint:'月搜索量 9.8万，新兴上升'},
    {id:'projector',label:'📽 迷你投影仪', hint:'月搜索量 7.1万，快速增长'},
  ],
  '厨房用品': [
    {id:'airfryer',  label:'🍳 空气炸锅',   hint:'月搜索量 24.6万，最热品类'},
    {id:'cookware',  label:'🍲 不粘锅套装', hint:'月搜索量 15.3万，稳定'},
    {id:'knife',     label:'🔪 厨师刀套装', hint:'月搜索量 11.2万，高客单价'},
  ]
};

var COUNTRIES = {de:'德国',fr:'法国',it:'意大利',nl:'荷兰',es:'西班牙'};
var COUNTRY_FLAGS = {de:'🇩🇪',fr:'🇫🇷',it:'🇮🇹',nl:'🇳🇱',es:'🇪🇸'};

/* ══ Country select ══ */
window.selectCountry = function(btn) {
  document.querySelectorAll('.country-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  state.country = btn.dataset.country;
  state.countryName = COUNTRIES[state.country];
};

/* ══ Input helpers ══ */
window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
};
window.handleKey = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
};

/* ══ Send ══ */
window.handleSend = function() {
  if (state.inputLocked) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  if (!state.country) { flashCountry(); return; }

  input.value = ''; input.style.height = 'auto';
  lockInput();
  addUserBubble(text);
  processInput(text);
};

function flashCountry() {
  var row = document.getElementById('countryRow');
  row.style.outline = '2px solid var(--red)';
  row.style.borderRadius = '6px';
  setTimeout(function(){ row.style.outline = ''; }, 1200);
  addAgentBubble('请先选择目标国家 👆', 'normal');
}

/* ══ Chat helpers ══ */
function addUserBubble(text) {
  var h = document.getElementById('chatHistory');
  var div = document.createElement('div');
  div.className = 'bubble user';
  div.innerHTML = '<div class="bubble-body"><div class="bubble-name">你</div><div class="bubble-text">' + escHtml(text) + '</div></div>';
  h.appendChild(div);
  scrollChat();
}

function addAgentBubble(html, type, id) {
  var h = document.getElementById('chatHistory');
  var div = document.createElement('div');
  div.className = 'bubble';
  if (id) div.id = id;
  var cls = type === 'thinking' ? 'agent-thinking' : type === 'system' ? 'system-msg' : '';
  var av = type === 'system' ? 'av-system' : 'av-agent';
  var name = type === 'system' ? 'System' : 'JoyOps Agent';
  div.innerHTML = '<div class="bubble-avatar ' + av + '">' + (type==='system'?'⚙':'J') + '</div><div class="bubble-body"><div class="bubble-name">' + name + '</div><div class="bubble-text ' + cls + '">' + html + '</div></div>';
  h.appendChild(div);
  scrollChat();
  return div;
}

function addToolCall(toolName, status) {
  var h = document.getElementById('chatHistory');
  var div = document.createElement('div');
  div.className = 'tool-call';
  div.innerHTML = '<span class="tc-icon">🔧</span><span class="tc-tag">' + toolName + '</span><span class="tc-status ' + (status==='ok'?'ok':'spin') + '">' + (status==='ok'?'✓ 完成':'执行中…') + '</span>';
  h.appendChild(div);
  scrollChat();
  return div;
}

function addChips(items, onSelect) {
  var h = document.getElementById('chatHistory');
  var wrap = document.createElement('div');
  wrap.className = 'chip-group';
  items.forEach(function(item) {
    var btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = item.label;
    btn.onclick = function() {
      wrap.querySelectorAll('.chip').forEach(function(c){ c.classList.add('disabled'); });
      btn.classList.add('selected');
      onSelect(item);
    };
    wrap.appendChild(btn);
  });
  h.appendChild(wrap);
  scrollChat();
}

function addHitlBtns(onChoice) {
  var h = document.getElementById('chatHistory');
  var wrap = document.createElement('div');
  wrap.className = 'hitl-btns';
  var opts = [
    {cls:'hb-go',    val:'continue', text:'✓ 风险可接受，继续执行 Marketing'},
    {cls:'hb-noted', val:'noted',    text:'⚠ 知悉风险，继续并接收合规约束'},
    {cls:'hb-stop',  val:'stop',     text:'✕ 风险过高，退出本次分析'},
  ];
  opts.forEach(function(o) {
    var btn = document.createElement('button');
    btn.className = 'hitl-btn ' + o.cls;
    btn.innerHTML = o.text;
    btn.onclick = function() {
      wrap.querySelectorAll('.hitl-btn').forEach(function(b){ b.disabled=true; b.style.opacity='.5'; });
      onChoice(o.val);
    };
    wrap.appendChild(btn);
  });
  h.appendChild(wrap);
  scrollChat();
}

function addConfirmBtn(label, onConfirm) {
  var h = document.getElementById('chatHistory');
  var wrap = document.createElement('div');
  wrap.className = 'confirm-btn-wrap';
  // 继续按钮
  var btn = document.createElement('button');
  btn.className = 'confirm-btn';
  btn.innerHTML = label;
  btn.onclick = function() {
    btn.disabled = true; exitBtn.disabled = true;
    btn.style.opacity = '.5'; exitBtn.style.opacity = '.5';
    onConfirm();
  };
  // 退出按钮
  var exitBtn = document.createElement('button');
  exitBtn.className = 'confirm-btn';
  exitBtn.style.cssText = 'border-color:var(--red-bd);background:var(--red-lt);color:var(--red);margin-top:5px';
  exitBtn.innerHTML = '✕ 不继续了，退出本次分析';
  exitBtn.onclick = function() {
    btn.disabled = true; exitBtn.disabled = true;
    btn.style.opacity = '.5'; exitBtn.style.opacity = '.5';
    doExit();
  };
  wrap.appendChild(btn);
  wrap.appendChild(exitBtn);
  h.appendChild(wrap);
  scrollChat();
}

function doExit() {
  state.timers.forEach(function(t){ clearTimeout(t); });
  state.timers = [];
  state.stage = 'input';
  state.selectedSubcat = null;
  addAgentBubble('已退出本次分析。你可以重新选择国家和品类开始新一轮分析 👇', 'system');
  setReportHeader('分析报告', '等待输入', 'rhb-waiting');
  document.querySelectorAll('.country-btn').forEach(function(b){ b.disabled = false; b.style.opacity = ''; });
  unlockInput();
}

function scrollChat() {
  var h = document.getElementById('chatHistory');
  setTimeout(function(){ h.scrollTop = h.scrollHeight; }, 50);
}

function lockInput() {
  state.inputLocked = true;
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
}
function unlockInput() {
  state.inputLocked = false;
  document.getElementById('chatInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function delay(ms, fn) {
  var t = setTimeout(fn, ms);
  state.timers.push(t);
  return t;
}

/* ══ Report panel helpers ══ */
function setReportHeader(title, badgeText, badgeCls) {
  document.getElementById('reportTitle').textContent = title;
  var b = document.getElementById('reportBadge');
  b.textContent = badgeText;
  b.className = 'rh-badge ' + badgeCls;
}

function clearReport() {
  document.getElementById('reportBody').innerHTML = '';
}

function addReportSection(html) {
  var body = document.getElementById('reportBody');
  // clear empty state
  var empty = body.querySelector('.report-empty');
  if (empty) empty.remove();
  var div = document.createElement('div');
  div.innerHTML = html;
  body.appendChild(div.firstChild || div);
  body.scrollTop = body.scrollHeight;
}

/* ══ Input processing ══ */
function processInput(text) {
  var lower = text.toLowerCase();
  // detect vague input
  var vague = isVague(lower);

  if (vague) {
    runClarify(text, vague);
  } else {
    // treat as specific category
    state.selectedSubcat = { id: 'airfryer', label: text };
    runScout();
  }
}

function isVague(text) {
  // 模糊词 → 澄清品类的 key
  var vagueMap = [
    {key:'小家电',   match:['小家电','小电器','家用电器','电器','家电','电子产品','电子']},
    {key:'厨房用品', match:['厨房用品','厨具','厨房']},
    {key:'小家电',   match:['食品','美妆','服装','户外','运动']},
  ];
  for (var i=0; i<vagueMap.length; i++) {
    var entry = vagueMap[i];
    for (var j=0; j<entry.match.length; j++) {
      if (text.indexOf(entry.match[j]) !== -1) return entry.key;
    }
  }
  return null;
}

/* ══ Stage 0: Clarify ══ */
function runClarify(text, category) {
  state.stage = 'clarify';
  setReportHeader('Router Agent · 品类解析', '分析中', 'rhb-running');

  delay(600, function() {
    addAgentBubble('收到，正在解析品类…', 'thinking');
  });
  delay(1400, function() {
    var tc = addToolCall('category_parser', 'spin');
    delay(900, function() {
      tc.querySelector('.tc-status').textContent = '✓ 完成';
      tc.querySelector('.tc-status').className = 'tc-status ok';
    });
  });
  delay(2600, function() {
    var subcats = SUBCATS[category] || SUBCATS['小家电'];
    addAgentBubble('「' + escHtml(text) + '」属于较宽泛的品类。我识别出以下几个在<strong>' + COUNTRY_FLAGS[state.country] + ' ' + state.countryName + '</strong>市场热度较高的细分方向，请选择您想深入分析的品类：', 'normal');
    addChips(subcats, function(item) {
      state.selectedSubcat = item;
      addUserBubble(item.label.replace(/^[^\s]+\s/,''));
      delay(400, function() { runScout(); });
    });
    setReportHeader('Router Agent · 品类解析', '等待选择', 'rhb-waiting');
    unlockInput();
    // show clarify info in report
    showClarifyReport(category, subcats);
  });
}

function showClarifyReport(category, subcats) {
  clearReport();
  setReportHeader('Router Agent · 品类拆分', '等待选择', 'rhb-waiting');
  var html = '<div class="r-section">' +
    '<div class="rs-head"><span class="rs-tag rst-blue">Router</span><h3>品类拆分结果 · ' + escHtml(category) + ' × ' + state.countryName + '</h3></div>' +
    '<div class="rs-body">' +
    '<div style="font-size:11px;color:var(--text2);margin-bottom:10px">Agent 判断输入品类过于宽泛，自动拆分为以下细分方向供选择：</div>' +
    '<div style="display:flex;flex-direction:column;gap:6px">';
  subcats.forEach(function(s) {
    html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px">' +
      '<span style="font-size:14px">' + s.label.split(' ')[0] + '</span>' +
      '<div><div style="font-size:12px;font-weight:600">' + s.label.replace(/^[^\s]+\s/,'') + '</div>' +
      '<div style="font-size:11px;color:var(--text3)">' + escHtml(s.hint) + '</div></div>' +
      '</div>';
  });
  html += '</div></div></div>';
  addReportSection(html);
}

/* ══ Stage 1: Scout ══ */
function runScout() {
  state.stage = 'scout_running';
  lockInput();
  var catLabel = state.selectedSubcat ? state.selectedSubcat.label.replace(/^[^\s]+\s/,'') : '空气炸锅';
  var co = state.countryName;

  setReportHeader('Scout Agent · 选品调研', '分析中…', 'rhb-running');
  clearReport();

  delay(300, function() {
    addAgentBubble('好的，开始对<strong>「' + escHtml(catLabel) + '」×『' + co + '』</strong>进行深度选品调研。启动 3 个子 Agent 并行采集数据…', 'normal');
  });

  // tool calls sequence
  var tools = [
    {name:'amazon_search', t:500},
    {name:'amazon_product_detail ×5', t:1300},
    {name:'ebay_search', t:2000},
    {name:'instagram_hashtag', t:2400},
    {name:'tiktok_trend', t:3100},
    {name:'reddit_search', t:3600},
    {name:'google_trends', t:4200},
    {name:'keyword_planner', t:4700},
  ];
  tools.forEach(function(tool) {
    delay(tool.t, function() {
      var tc = addToolCall(tool.name, 'spin');
      delay(600, function() {
        tc.querySelector('.tc-status').textContent = '✓ 完成';
        tc.querySelector('.tc-status').className = 'tc-status ok';
      });
    });
  });

  delay(5500, function() {
    addAgentBubble('数据采集完成，Scout 主控正在进行<strong>交叉判断</strong>（需求-竞争比 / 趋势-声量一致性 / 痛点-差异化空间）…', 'thinking');
  });

  delay(7000, function() {
    addAgentBubble('选品报告已生成，机会评分 <strong>7.5 / 10</strong>，建议进入。详细报告已显示在右侧，请查阅。', 'normal');
    showScoutReport(catLabel, co);
    state.stage = 'scout_done';
    setReportHeader('Scout 选品报告 · ' + catLabel + ' × ' + co, '分析完成 · 待确认', 'rhb-done');

    delay(500, function() {
      addAgentBubble('📋 请在右侧查看完整选品报告。确认后点击下方按钮继续合规审查。', 'normal');
      addConfirmBtn('⚖️ 报告已看完，继续合规审查 →', function() {
        runGuard(catLabel, co);
      });
    });
  });
}

function makeSvgLine(values) {
  var W = 300, H = 60;
  var mn = Math.min.apply(null, values), mx = Math.max.apply(null, values);
  var range = mx - mn || 1;
  var pts = values.map(function(v, i) {
    var x = (i / (values.length - 1)) * W;
    var y = H - ((v - mn) / range) * (H - 8) - 4;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var polyline = pts.join(' ');
  // area fill path
  var areaPath = 'M' + pts[0] + ' L' + pts.join(' L') +
    ' L' + (W) + ',' + H + ' L0,' + H + ' Z';
  return '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#2563EB" stop-opacity=".18"/>' +
    '<stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<path d="' + areaPath + '" fill="url(#tg)"/>' +
    '<polyline points="' + polyline + '" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</svg>';
}

function showScoutReport(cat, co) {
  clearReport();
  var sd = SCOUT_DATA[state.country] || SCOUT_DATA['de'];
  var ec = sd.ecom;
  var tr = sd.trend;
  var so = sd.social;
  var ms = sd.master;

  // ── 总体评分 header ──
  var scoreHtml = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;animation:fadeUp .4s ease">' +
    '<div style="padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:14px">' +
      '<div style="display:flex;align-items:baseline;gap:4px">' +
        '<span style="font-size:40px;font-weight:800;color:var(--green);letter-spacing:-2px;line-height:1">7.5</span>' +
        '<span style="font-size:14px;color:var(--text3);font-weight:500">/ 10</span>' +
      '</div>' +
      '<div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--green)">推荐进入</div>' +
        '<div style="font-size:11px;color:var(--text2);margin-top:2px">综合机会评分 · Scout Agent 输出 · ' + sd.countryName + '</div>' +
      '</div>' +
      '<div style="margin-left:auto;display:flex;gap:6px">' +
        '<span style="font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)">✓ 真实增长需求</span>' +
        '<span style="font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;background:var(--blue-lt);color:var(--blue);border:1px solid var(--blue-bd)">有差异化空间</span>' +
      '</div>' +
    '</div>' +
  '</div>';
  addReportSection(scoreHtml);

  // ── 三列子 Agent ──
  var trendValues = [28,31,29,34,38,35,40,42,39,44,48,52,55,51,57,60,58,63,65,62,68,72,70,75];
  var svgHtml = makeSvgLine(trendValues);

  // 竞争密度 bars
  var catBarsHtml = ec.catBars.map(function(b, i) {
    return '<div style="display:flex;align-items:center;gap:6px;font-size:10px">' +
      '<div style="width:50px;color:' + ec.catBarsTextColor[i] + ';flex-shrink:0">' + b.label + '</div>' +
      '<div style="flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden">' +
        '<div style="width:' + b.w + ';height:100%;background:' + b.color + ';border-radius:3px"></div>' +
      '</div>' +

/* ══ Stage 2: Guard ══ */
function runGuard(cat, co) {
  state.stage = 'guard_running';
  setReportHeader('Guard Agent · 合规审查', '分析中…', 'rhb-running');

  delay(200, function() {
    addAgentBubble('启动 Guard Agent，正在推断「' + escHtml(cat) + '」的法规分类…', 'thinking');
  });
  delay(1000, function() {
    addAgentBubble('自主推断法规分类：<strong>带电产品</strong> + <strong>食品接触材料</strong>（炸篮直接接触食物）。构建检索 query，向量检索法规知识库…', 'normal');
  });

  var gd = GUARD_DATA[state.country] || GUARD_DATA['de'];
  var countryLayerName = gd.countryName + '国家层';
  var mandatoryCount = gd.risk.mandatories;
  var riskLevel = gd.risk.level;
  var eta = gd.risk.eta;

  var gTools = [
    {name:'law_kb_search · 欧盟层', t:1800},
    {name:'law_kb_search · ' + countryLayerName, t:2600},
  ];
  gTools.forEach(function(tool) {
    delay(tool.t, function() {
      var tc = addToolCall(tool.name, 'spin');
      delay(700, function() {
        tc.querySelector('.tc-status').textContent = '✓ 完成';
        tc.querySelector('.tc-status').className = 'tc-status ok';
      });
    });
  });

  delay(3800, function() {
    addAgentBubble('合规审查完成，匹配 ' + mandatoryCount + ' 条强制法规，无阻断项，综合评级：<strong>' + riskLevel + '风险</strong>。', 'normal');
    showGuardReport(cat, co);
    state.stage = 'guard_done';
    setReportHeader('Guard 合规报告 · ' + cat + ' × ' + gd.countryName, '审查完成', 'rhb-done');

    delay(500, function() {
      addAgentBubble('⚠ <strong>需要您确认</strong>：合规审查发现 ' + mandatoryCount + ' 项强制认证要求，预计认证周期 ' + eta + '。请选择下一步操作：', 'normal');
      addHitlBtns(function(choice) { handleHitl(choice, cat, co); });
    });
  });
}

function makeRuleCard(rule) {
  return '<div class="rule-card">' +
    '<div class="rule-sev ' + (rule.badgeCls === 'rb-fatal' ? 'rs-must' : 'rs-high') + '"></div>' +
    '<div class="rule-body">' +
      '<div class="rule-name">' + escHtml(rule.name) + ' <span class="rule-badge ' + rule.badgeCls + '">' + rule.badge + '</span></div>' +
      '<div class="rule-desc">' + escHtml(rule.desc) + '</div>' +
    '</div>' +
  '</div>';
}

function makeTimelineItem(item, isLast) {
  return '<div class="ct-item">' +
    '<div class="ct-week">' + escHtml(item.week) + '</div>' +
    '<div class="ct-line">' +
      '<div class="ct-dot ' + item.dot + '"></div>' +
      (isLast ? '' : '<div class="ct-connector"></div>') +
    '</div>' +
    '<div class="ct-content">' +
      '<div class="ct-name">' + item.name + '</div>' +
      '<div class="ct-detail">' + escHtml(item.detail) + '</div>' +
      (item.parallel ? '<div class="ct-parallel">' + escHtml(item.parallel) + '</div>' : '') +
    '</div>' +
  '</div>';
}

function makeExecItem(text, bulletCls) {
  return '<div class="ec-item">' +
    '<div class="ec-bullet ' + bulletCls + '">✓</div>' +
    '<div>' + escHtml(text) + '</div>' +
  '</div>';
}

function showGuardReport(cat, co) {
  clearReport();

  // 根据 state.country 获取数据，fallback to 'de'
  var countryKey = state.country || 'de';
  var d = GUARD_DATA[countryKey] || GUARD_DATA['de'];

  // ── 1. 决策摘要（Verdict Header）──
  var verdictHtml = '<div class="guard-verdict">' +
    '<div class="gv-light ' + d.risk.cls + '"></div>' +
    '<div class="gv-status" style="color:var(--' + d.risk.cls + ')">' + d.risk.level + '风险</div>' +
    '<div class="gv-counters">' +
      '<div class="gv-cnt"><div class="gvc-num" style="color:var(--green)">' + d.risk.blockers + '</div><div class="gvc-label">阻断项</div></div>' +
      '<div class="gv-cnt"><div class="gvc-num" style="color:var(--red)">' + d.risk.mandatories + '</div><div class="gvc-label">强制要求</div></div>' +
    '</div>' +
    '<div class="gv-eta"><div class="gv-eta-num">' + d.risk.eta + '</div><div class="gv-eta-label">预计认证周期</div></div>' +
    '<div style="max-width:260px">' +
      '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px">Guard Agent 判断</div>' +
      '<div style="font-size:11px;color:var(--text2);line-height:1.6">' + escHtml(d.tips) + '</div>' +
    '</div>' +
  '</div>';
  addReportSection(verdictHtml);

  // ── 2. 法规分层地图 ──
  var euCards = d.euRules.map(function(r){ return makeRuleCard(r); }).join('');
  var localCards = d.localRules.map(function(r){ return makeRuleCard(r); }).join('');
  var coTagCls = 'rll-' + countryKey;

  var regMapHtml = '<div class="reg-map">' +
    '<div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:10px">' +
      '<div style="font-size:15px;font-weight:700;flex:1">法规分层地图</div>' +
      '<div style="font-size:11px;color:var(--text2)">法规分类推断：<strong>带电产品</strong> + <strong>食品接触材料</strong></div>' +
    '</div>' +
    '<div class="reg-layer">' +
      '<div class="reg-layer-label">' +
        '<span class="rll-tag rll-eu">EU</span>' +
        '<div class="rll-name">欧盟统一法规</div>' +
      '</div>' +
      '<div class="reg-layer-rules">' + euCards + '</div>' +
    '</div>' +
    '<div class="reg-layer">' +
      '<div class="reg-layer-label">' +
        '<span class="rll-tag ' + coTagCls + '">' + d.countryLayer + '</span>' +
        '<div class="rll-name">' + d.countryName + '本地加严</div>' +
      '</div>' +
      '<div class="reg-layer-rules">' + localCards + '</div>' +
    '</div>' +
  '</div>';
  addReportSection(regMapHtml);

  // ── 3. 认证时间轴 ──
  var timelineItems = d.timeline.map(function(item, i) {
    return makeTimelineItem(item, i === d.timeline.length - 1);
  }).join('');

  var timelineHtml = '<div class="cert-timeline">' +
    '<div class="ct-head">' +
      '<div class="ct-head-title">认证时间轴（建议顺序）</div>' +
      '<div style="font-size:11px;color:var(--amber);font-weight:600">预计 ' + d.risk.eta + ' 完成</div>' +
    '</div>' +
    '<div class="ct-body"><div class="ct-track">' + timelineItems + '</div></div>' +
  '</div>';
  addReportSection(timelineHtml);

  // ── 4. 执行清单（2列）──
  var urgentItems = d.actions.urgent.map(function(t){ return makeExecItem(t, 'ecb-red'); }).join('');
  var importantItems = d.actions.important.map(function(t){ return makeExecItem(t, 'ecb-amber'); }).join('');

/* ══ Stage 3: HITL ══ */
function handleHitl(choice, cat, co) {
  if (choice === 'stop') {
    addUserBubble('风险过高，退出本次分析');
    doExit();
    return;
  }
  var msg = choice === 'noted'
    ? '已知悉风险，继续执行。Marketing Agent 将接收合规约束：标注 CE 标志、不使用绝对化表达。'
    : '确认继续，启动 Marketing Agent 生成本土化文案…';
  addUserBubble(choice === 'noted' ? '知悉风险，继续' : '确认继续');
  delay(300, function() {
    addAgentBubble(msg, 'normal');
    delay(600, function() { runMarketing(cat, co); });
  });
}

      {tag:'🏷️ 超值品质', en:'【Calidad Premium, Precio Justo】 CE Certificada · Clase A · 8 Programas Automáticos ✓', cn:'西班牙消费者价格敏感，「高品质合理价格」是有效定位'},
    ],
    patterns: [
      {type:'美食文化型', example:'Patatas perfectas, croquetas crujientes, pollo dorado – todo sin aceite', why:'西班牙食物名称引发强烈文化认同'},
      {type:'家庭氛围型', example:'La freidora que hace feliz a toda la familia en cada comida', why:'家庭情感是西班牙消费决策的重要因素'},
      {type:'性价比型', example:'Calidad de marca premium a precio accesible – más de 5.000 familias ya confían', why:'西班牙消费者价格敏感，「物超所值」是强力购买理由'},
    ],
    compliance: ['✓ 标注 CE 认证（Guard 要求）','✓ WEEE 生产者编号标注','✓ 西班牙语（Español）说明书','✓ 无虚假承诺表达'],
  }
};

function runMarketing(cat, co) {
  state.stage = 'marketing_running';
  var md = MKTG_DATA[state.country] || MKTG_DATA['de'];
  setReportHeader('Marketing Agent · 本土化文案', '生成中…', 'rhb-running');
  clearReport();

  delay(200, function() {
    addAgentBubble('已接收合规约束，启动 Marketing Agent。抓取 ' + md.platform + ' 竞品 listing 数据…', 'thinking');
  });

  var mTools = [
    {name:'amazon_listing_scraper · ' + md.platform, t:500},
    {name:'keyword_density_analyzer', t:1400},
    {name:'ad_law_check · ' + md.name + '广告法', t:2200},
    {name:'listing_optimizer · ' + md.name + '本土化', t:3200},
  ];
  mTools.forEach(function(tool) {
    delay(tool.t, function() {
      var tc = addToolCall(tool.name, 'spin');
      delay(700, function() {
        tc.querySelector('.tc-status').textContent = '✓ 完成';
        tc.querySelector('.tc-status').className = 'tc-status ok';
      });
    });
  });

  delay(1500, function() {
    addAgentBubble('竞品数据抓取完成。识别到 3 个竞品关键差距，提炼 ' + md.kwMain.length + ' 个核心关键词…', 'normal');
  });
  delay(2800, function() {
    addAgentBubble('<strong>直接用' + md.name + '语写作</strong>（非翻译），植入本地消费者痛点和文化偏好，合规约束已内嵌…', 'thinking');
  });

  delay(4500, function() {
    addAgentBubble('文案生成完成！' + md.flag + ' ' + md.platform + ' Listing 已显示在右侧，所有合规约束已遵守。', 'normal');
    showMarketingReport(cat, co);
    state.stage = 'done';
    setReportHeader('Marketing 文案报告 · ' + cat + ' × ' + md.name, '生成完成', 'rhb-done');

    delay(500, function() {
      addAgentBubble('✅ <strong>全链路分析完成</strong>：Scout → Guard → Marketing 三阶段报告已生成。如需重新分析请刷新页面。', 'system');
      unlockInput();
    });
  });
}

function showMarketingReport(cat, co) {
  var md = MKTG_DATA[state.country] || MKTG_DATA['de'];
  var ts = '抓取时间：2025-07-15 ' + (9 + Math.floor(Math.random()*3)) + ':' + (10+Math.floor(Math.random()*40)) + ' · 来源：' + md.platform;

  // ── 1. 本土化策略 Header ──
  var stratHtml = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;animation:fadeUp .4s ease">' +
    '<div style="padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--purple-lt),var(--surface2));display:flex;align-items:center;gap:14px">' +
      '<div style="font-size:32px">' + md.flag + '</div>' +
      '<div style="flex:1">' +
        '<div style="font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px">Marketing Agent · 本土化策略</div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--text)">' + md.name + ' · ' + md.tagline + '</div>' +
      '</div>' +
      '<div style="font-size:10px;color:var(--text3);text-align:right">' + md.platform + '</div>' +
    '</div>' +
    '<div style="padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
      '<div>' +
        '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:5px">消费者画像</div>' +
        '<div style="font-size:12px;color:var(--text2);line-height:1.65">' + escHtml(md.persona) + '</div>' +
      '</div>' +
      '<div style="background:var(--purple-lt);border:1px solid var(--purple-bd);border-radius:8px;padding:12px">' +
        '<div style="font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;margin-bottom:5px">核心文案策略</div>' +
        '<div style="font-size:12px;color:var(--purple);line-height:1.65">' + escHtml(md.strategy) + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
  addReportSection(stratHtml);

  // ── 2. 竞品分析 + 关键词（并列两列）──
  var compCards = md.competitors.map(function(c) {
    return '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:10px;align-items:flex-start">' +
      '<div style="width:40px;height:40px;border-radius:7px;background:' + c.img + ';flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white">' + c.brand.split(' ')[0].slice(0,3).toUpperCase() + '</div>' +
      '<div style="flex:1">' +
        '<div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px">' + escHtml(c.brand) + '</div>' +
        '<div style="display:flex;gap:8px;font-size:11px;color:var(--text2);margin-bottom:5px">' +
          '<span style="font-weight:700">' + c.price + '</span>' +
          '<span>' + c.rating + '</span>' +
          '<span style="color:var(--text3)">' + c.reviews + ' 评价</span>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--red);background:var(--red-lt);border:1px solid var(--red-bd);border-radius:5px;padding:4px 8px">⚠ 差距：' + escHtml(c.gap) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  var kwRows = md.kwMain.map(function(k) {
    return '<div style="padding:8px 0;border-bottom:1px solid var(--border)">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">' +
        '<div style="flex:1;font-size:12px;font-weight:700;color:var(--text);font-family:Georgia,serif;word-break:break-word">' + escHtml(k.kw) + '</div>' +
        '<div style="font-size:10px;padding:2px 7px;border-radius:100px;flex-shrink:0;' + (k.used ? 'background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)' : 'background:var(--surface3);color:var(--text3);border:1px solid var(--border)') + ';font-weight:600;white-space:nowrap">' + (k.used ? '✓ 已植入' : '— 暂未用') + '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<div style="font-size:11px;color:var(--text3)">中文：' + escHtml(k.cn || '') + '</div>' +
        '<div style="font-size:10px;color:var(--text3);margin-left:auto">月搜索 ' + escHtml(k.vol) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  var col2Html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;animation:fadeUp .4s ease">' +

    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px">🔍 竞品 Listing 分析 <span style="font-size:9px;color:var(--text3);font-weight:400;margin-left:auto">' + ts + '</span></div>' +
      '<div style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">' + compCards + '</div>' +
      '<div style="padding:10px 14px;background:var(--green-lt);border-top:1px solid var(--green-bd)">' +
        '<div style="font-size:11px;color:var(--green);font-weight:600">💡 我们的差异化优势</div>' +
        '<div style="font-size:11px;color:var(--green);margin-top:3px;line-height:1.55">炸篮可进洗碗机 + 5.5L大容量 + ≤42dB静音 — 三点全覆盖，无竞品同时做到</div>' +
      '</div>' +
    '</div>' +

    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:700">🔑 关键词策略</div>' +
      '<div style="padding:12px 14px">' + kwRows + '</div>' +
      '<div style="padding:10px 14px;background:var(--blue-lt);border-top:1px solid var(--blue-bd);font-size:11px;color:var(--blue)">📌 ' + md.kwMain.filter(function(k){return k.used;}).length + ' 个核心关键词已植入标题和五点描述</div>' +
    '</div>' +

  '</div>';
  addReportSection(col2Html);

  // ── 3. 我们的 Listing（带设计意图注释）──
  var bulletRows = md.bullets.map(function(b) {
    return '<div style="margin-bottom:10px">' +
      '<div style="display:flex;gap:8px;align-items:flex-start">' +
        '<div style="flex:1;font-size:12px;color:var(--text2);line-height:1.65;padding:9px 12px;border-left:3px solid var(--purple-bd);background:var(--purple-lt);border-radius:0 7px 7px 0;font-family:Georgia,serif">' + b.en + '</div>' +
      '</div>' +
      '<div style="margin-top:4px;margin-left:3px;display:flex;align-items:center;gap:6px">' +
        '<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:var(--surface3);color:var(--text3);border:1px solid var(--border);font-weight:600">' + escHtml(b.tag) + '</span>' +
        '<span style="font-size:10px;color:var(--text3)">→ ' + escHtml(b.cn) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  var listingHtml = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;animation:fadeUp .4s ease">' +
    '<div style="padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:10px">' +
      '<div style="font-size:14px;font-weight:700;flex:1">📝 ' + md.platform + ' Listing · ' + md.name + '语</div>' +
      '<div style="font-size:10px;color:var(--text3)">带设计意图注释</div>' +
    '</div>' +
    '<div style="padding:16px 20px">' +
      '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">标题（含关键词）</div>' +
      '<div style="font-size:13px;font-weight:700;line-height:1.6;font-family:Georgia,serif;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;color:var(--text)">' + escHtml(md.title) + '</div>' +
      '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">五点描述（右侧为设计意图）</div>' +
      bulletRows +
    '</div>' +
  '</div>';
  addReportSection(listingHtml);

  // ── 4. 文案范式 + 合规记录（并列）──
  var patternCards = md.patterns.map(function(p, i) {
    var colors = ['var(--blue)', 'var(--purple)', 'var(--green)'];
    var lts = ['var(--blue-lt)', 'var(--purple-lt)', 'var(--green-lt)'];
    var bds = ['var(--blue-bd)', 'var(--purple-bd)', 'var(--green-bd)'];
    return '<div style="padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">' +
      '<div style="font-size:11px;font-weight:700;color:' + colors[i%3] + ';margin-bottom:5px">' + escHtml(p.type) + '</div>' +
      '<div style="font-size:12px;font-style:italic;color:var(--text);font-family:Georgia,serif;padding:8px 10px;background:' + lts[i%3] + ';border-left:3px solid ' + bds[i%3] + ';border-radius:0 5px 5px 0;margin-bottom:5px;line-height:1.6">"' + escHtml(p.example) + '"</div>' +
      '<div style="font-size:11px;color:var(--text3);line-height:1.55">→ ' + escHtml(p.why) + '</div>' +
    '</div>';
  }).join('');

  var complianceTags = md.compliance.map(function(c) {
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--green-lt);border:1px solid var(--green-bd);border-radius:7px;font-size:12px;color:var(--green);font-weight:500">' + escHtml(c) + '</div>';
  }).join('');

  var lastHtml = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;animation:fadeUp .4s ease">' +

    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:700">✍️ 高转化文案范式</div>' +
      '<div style="padding:12px 14px">' + patternCards + '</div>' +
    '</div>' +

    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:13px;font-weight:700">⚖️ Guard 合规约束落地</div>' +
      '<div style="padding:12px 14px;display:flex;flex-direction:column;gap:7px">' + complianceTags + '</div>' +
      '<div style="padding:10px 14px;background:var(--surface3);border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.6">所有文案由 Marketing Agent 直接用' + md.name + '语写作，已通过 Guard 合规校验，非机器翻译。</div>' +
    '</div>' +

  '</div>';
  addReportSection(lastHtml);
}
